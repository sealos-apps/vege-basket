apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: vege-basket
spec:
  title: Veges
  url: https://github.com/felixqiu014-wq/vege-basket
  gitRepo: https://github.com/felixqiu014-wq/vege-basket
  author: felixqiu014-wq
  description: Project and testing workspace for journals, todos, test plans, bugs, package timelines, and AI summaries.
  readme: https://raw.githubusercontent.com/felixqiu014-wq/vege-basket/main/README.md
  icon: https://raw.githubusercontent.com/labring-actions/templates/main/template/sealos.svg
  templateType: inline
  categories:
    - tool
  locale: en
  i18n:
    zh:
      description: 用于管理项目、日记、待办、草稿、安装升级时间线和 AI 总结的个人项目工作台。
  defaults:
    app_name:
      type: string
      value: vege-basket-${{ random(8) }}
    app_host:
      type: string
      value: vege-basket-${{ random(8) }}
  inputs:
    VEGES_IMAGE:
      description: Immutable linux/amd64 image tag or digest built from the Veges revision being deployed.
      type: string
      default: ''
      required: true
    APP_ENCRYPTION_ACTIVE_KEY_ID:
      description: Active encryption key id used by the server.
      type: string
      default: v1
      required: true
    APP_ENCRYPTION_KEYS:
      description: AES-256-GCM key mapping like v1:base64key used to decrypt and encrypt sensitive data.
      type: string
      default: ''
      required: true
    VEGES_ADMIN_USERNAMES:
      description: Comma-separated trusted Veges usernames allowed to assign account roles. Empty disables role administration.
      type: string
      default: ''
      required: false
    AI_API_BASE:
      description: Optional OpenAI-compatible AI API base URL saved as the default per-instance provider endpoint.
      type: string
      default: ''
      required: false
    AI_API_KEY:
      description: Optional default AI API key for this instance.
      type: string
      default: ''
      required: false
    AI_MODEL:
      description: Optional default AI model name.
      type: string
      default: ''
      required: false
    AI_GLOBAL_RATE_LIMIT:
      description: Maximum shared AI requests accepted by one application replica per rate window.
      type: string
      default: '30'
      required: false
    FEISHU_WEBHOOK_USER_EMAIL:
      description: Username that receives Feishu conversation analysis drafts.
      type: string
      default: ''
      required: false
    FEISHU_WEBHOOK_BASIC_USER:
      description: Optional HTTP basic auth username for the Feishu webhook endpoint.
      type: string
      default: ''
      required: false
    FEISHU_WEBHOOK_BASIC_PASSWORD:
      description: Optional HTTP basic auth password for the Feishu webhook endpoint.
      type: string
      default: ''
      required: false
    FEISHU_APP_ID:
      description: Optional Feishu application id for message fetch and sender lookup.
      type: string
      default: ''
      required: false
    FEISHU_APP_SECRET:
      description: Optional Feishu application secret.
      type: string
      default: ''
      required: false
    FEISHU_DELIVERY_ENABLED:
      description: Set to false to stop all outbound Feishu notification delivery.
      type: string
      default: 'true'
      required: false
    FEISHU_AI_CHAT_ENABLED:
      description: Enable Veges AI conversations and todo proposal cards in private Feishu bot chats.
      type: string
      default: 'false'
      required: false
    FEISHU_VERIFICATION_TOKEN:
      description: Required Feishu webhook verification token used before accepting challenge or event payloads.
      type: string
      default: ''
      required: true
    FEISHU_ENCRYPT_KEY:
      description: Optional Feishu webhook encrypt key.
      type: string
      default: ''
      required: false
    OSS_ENDPOINT:
      description: Alibaba OSS endpoint required for todo image uploads and package timeline features.
      type: string
      default: ''
      required: true
    OSS_ACCESS_KEY_ID:
      description: Alibaba OSS access key id required for todo image uploads and package timeline features.
      type: string
      default: ''
      required: true
    OSS_ACCESS_KEY_SECRET:
      description: Alibaba OSS access key secret required for todo image uploads and package timeline features.
      type: string
      default: ''
      required: true
    OSS_BUCKET:
      description: Alibaba OSS bucket name required for todo image uploads and package timeline features.
      type: string
      default: ''
      required: true
    PACKAGE_MARKET_MIDDLEWARE_ROOT:
      description: Compatibility fallback for middleware discovery; preferred roots are configured in package-market YAML page_kinds.middleware.discovery.roots.
      type: string
      default: ''
      required: false
    PACKAGE_MARKET_BASE_OBJECT_TEMPLATE:
      description: Optional legacy base-package object template; apps rules take precedence.
      type: string
      default: ''
      required: false
    PACKAGE_MARKET_BASE_LIST_PREFIX_TEMPLATE:
      description: Optional legacy base-package listing prefix; apps rules take precedence.
      type: string
      default: ''
      required: false
    PACKAGE_MARKET_DOWNLOAD_EXPIRE_SECONDS:
      description: Optional signed URL expiry time in seconds for package downloads.
      type: string
      default: '1800'
      required: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-pg
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg
---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: postgresql-16.4.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-16.4.0
  name: ${{ defaults.app_name }}-pg
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-16.4.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 50m
          memory: 51Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: pgsql-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: vegebasket
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 90); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
              if ! psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" | grep -q 1; then
                psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PG_DATABASE}\";"
              fi
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
  annotations:
    originImageName: ${{ inputs.VEGES_IMAGE }}
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ${{ defaults.app_name }}
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: vegebasket
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 90); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
              if ! psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" | grep -q 1; then
                psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PG_DATABASE}\";"
              fi
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: ${{ defaults.app_name }}
          image: ${{ inputs.VEGES_IMAGE }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '8787'
            - name: APP_PUBLIC_URL
              value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/vegebasket
            - name: DB_POOL_MAX
              value: '10'
            - name: DB_POOL_CONNECTION_TIMEOUT_MS
              value: '3000'
            - name: DB_POOL_IDLE_TIMEOUT_MS
              value: '30000'
            - name: APP_ENCRYPTION_ACTIVE_KEY_ID
              value: ${{ inputs.APP_ENCRYPTION_ACTIVE_KEY_ID }}
            - name: APP_ENCRYPTION_KEYS
              value: ${{ inputs.APP_ENCRYPTION_KEYS }}
            - name: VEGES_ADMIN_USERNAMES
              value: ${{ inputs.VEGES_ADMIN_USERNAMES }}
            - name: AI_API_BASE
              value: ${{ inputs.AI_API_BASE }}
            - name: AI_API_KEY
              value: ${{ inputs.AI_API_KEY }}
            - name: AI_MODEL
              value: ${{ inputs.AI_MODEL }}
            - name: AI_RATE_LIMIT
              value: '5'
            - name: AI_GLOBAL_RATE_LIMIT
              value: ${{ inputs.AI_GLOBAL_RATE_LIMIT }}
            - name: AI_RATE_WINDOW_MS
              value: '60000'
            - name: AI_MAX_MESSAGE_LENGTH
              value: '2000'
            - name: AI_MAX_CONTEXT_CHARS
              value: '12000'
            - name: FEISHU_WEBHOOK_USER_EMAIL
              value: ${{ inputs.FEISHU_WEBHOOK_USER_EMAIL }}
            - name: FEISHU_WEBHOOK_BASIC_USER
              value: ${{ inputs.FEISHU_WEBHOOK_BASIC_USER }}
            - name: FEISHU_WEBHOOK_BASIC_PASSWORD
              value: ${{ inputs.FEISHU_WEBHOOK_BASIC_PASSWORD }}
            - name: FEISHU_APP_ID
              value: ${{ inputs.FEISHU_APP_ID }}
            - name: FEISHU_APP_SECRET
              value: ${{ inputs.FEISHU_APP_SECRET }}
            - name: FEISHU_DELIVERY_ENABLED
              value: ${{ inputs.FEISHU_DELIVERY_ENABLED }}
            - name: FEISHU_AI_CHAT_ENABLED
              value: ${{ inputs.FEISHU_AI_CHAT_ENABLED }}
            - name: FEISHU_VERIFICATION_TOKEN
              value: ${{ inputs.FEISHU_VERIFICATION_TOKEN }}
            - name: FEISHU_ENCRYPT_KEY
              value: ${{ inputs.FEISHU_ENCRYPT_KEY }}
            - name: OSS_ENDPOINT
              value: ${{ inputs.OSS_ENDPOINT }}
            - name: OSS_ACCESS_KEY_ID
              value: ${{ inputs.OSS_ACCESS_KEY_ID }}
            - name: OSS_ACCESS_KEY_SECRET
              value: ${{ inputs.OSS_ACCESS_KEY_SECRET }}
            - name: OSS_BUCKET
              value: ${{ inputs.OSS_BUCKET }}
            - name: PACKAGE_MARKET_RULES_FILE
              value: /app/server/trial-combo-package-rules.yaml
            - name: PACKAGE_MARKET_MIDDLEWARE_ROOT
              value: ${{ inputs.PACKAGE_MARKET_MIDDLEWARE_ROOT }}
            - name: PACKAGE_MARKET_BASE_OBJECT_TEMPLATE
              value: ${{ inputs.PACKAGE_MARKET_BASE_OBJECT_TEMPLATE }}
            - name: PACKAGE_MARKET_BASE_LIST_PREFIX_TEMPLATE
              value: ${{ inputs.PACKAGE_MARKET_BASE_LIST_PREFIX_TEMPLATE }}
            - name: PACKAGE_MARKET_DOWNLOAD_EXPIRE_SECONDS
              value: ${{ inputs.PACKAGE_MARKET_DOWNLOAD_EXPIRE_SECONDS }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8787
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 25Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${{ defaults.app_name }}-todo-digest
  labels:
    app: ${{ defaults.app_name }}
    app.kubernetes.io/component: todo-digest-worker
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  schedule: '*/5 * * * *'
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: ${{ defaults.app_name }}
            app.kubernetes.io/component: todo-digest-worker
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: ${{ defaults.app_name }}
          restartPolicy: Never
          containers:
            - name: todo-digest-worker
              image: ${{ inputs.VEGES_IMAGE }}
              imagePullPolicy: IfNotPresent
              command:
                - node
                - server/todo-digest-worker.ts
              env:
                - name: NODE_ENV
                  value: production
                - name: APP_PUBLIC_URL
                  value: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
                - name: PG_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${{ defaults.app_name }}-pg-conn-credential
                      key: host
                - name: PG_PORT
                  valueFrom:
                    secretKeyRef:
                      name: ${{ defaults.app_name }}-pg-conn-credential
                      key: port
                - name: PG_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${{ defaults.app_name }}-pg-conn-credential
                      key: username
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${{ defaults.app_name }}-pg-conn-credential
                      key: password
                - name: DATABASE_URL
                  value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/vegebasket
                - name: DB_POOL_MAX
                  value: '2'
                - name: DB_POOL_CONNECTION_TIMEOUT_MS
                  value: '3000'
                - name: DB_POOL_IDLE_TIMEOUT_MS
                  value: '30000'
                - name: APP_ENCRYPTION_ACTIVE_KEY_ID
                  value: ${{ inputs.APP_ENCRYPTION_ACTIVE_KEY_ID }}
                - name: APP_ENCRYPTION_KEYS
                  value: ${{ inputs.APP_ENCRYPTION_KEYS }}
                - name: FEISHU_APP_ID
                  value: ${{ inputs.FEISHU_APP_ID }}
                - name: FEISHU_APP_SECRET
                  value: ${{ inputs.FEISHU_APP_SECRET }}
                - name: FEISHU_DELIVERY_ENABLED
                  value: ${{ inputs.FEISHU_DELIVERY_ENABLED }}
              resources:
                requests:
                  cpu: 20m
                  memory: 25Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8787
      targetPort: 8787
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8787
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: https://raw.githubusercontent.com/labring-actions/templates/main/template/sealos.svg
  name: Veges
  type: link
