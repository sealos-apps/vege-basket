apiVersion: v1
kind: Secret
metadata:
  name: vege-basket-apeimsoi-todo-digest-runtime
  namespace: ns-paxilf30
type: Opaque
stringData:
  # Copy these values exactly from the production Veges Deployment.
  APP_ENCRYPTION_ACTIVE_KEY_ID: REPLACE_WITH_PRODUCTION_ACTIVE_KEY_ID
  APP_ENCRYPTION_KEYS: REPLACE_WITH_COMPLETE_PRODUCTION_KEY_RING
  FEISHU_APP_ID: REPLACE_WITH_PRODUCTION_FEISHU_APP_ID
  FEISHU_APP_SECRET: REPLACE_WITH_PRODUCTION_FEISHU_APP_SECRET
  FEISHU_DELIVERY_ENABLED: "true"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vege-basket-apeimsoi-todo-digest
  namespace: ns-paxilf30
  labels:
    app: vege-basket-apeimsoi
    app.kubernetes.io/component: todo-digest-worker
spec:
  schedule: "*/5 * * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: vege-basket-apeimsoi
            app.kubernetes.io/component: todo-digest-worker
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: vege-basket-apeimsoi
          restartPolicy: Never
          containers:
            - name: todo-digest-worker
              image: ghcr.io/felixqiu014-wq/vege-basket:20260727-224448
              imagePullPolicy: IfNotPresent
              command:
                - node
                - server/todo-digest-worker.ts
              envFrom:
                - secretRef:
                    name: vege-basket-apeimsoi-todo-digest-runtime
              env:
                - name: NODE_ENV
                  value: production
                - name: APP_PUBLIC_URL
                  value: https://veges.private.sealos.pub
                - name: PG_HOST
                  valueFrom:
                    secretKeyRef:
                      name: REPLACE_WITH_DATABASE_SECRET_NAME
                      key: host
                - name: PG_PORT
                  valueFrom:
                    secretKeyRef:
                      name: REPLACE_WITH_DATABASE_SECRET_NAME
                      key: port
                - name: PG_USER
                  valueFrom:
                    secretKeyRef:
                      name: REPLACE_WITH_DATABASE_SECRET_NAME
                      key: username
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: REPLACE_WITH_DATABASE_SECRET_NAME
                      key: password
                - name: DATABASE_URL
                  value: postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/vegebasket
                - name: DB_POOL_MAX
                  value: '2'
                - name: DB_POOL_CONNECTION_TIMEOUT_MS
                  value: '3000'
                - name: DB_POOL_IDLE_TIMEOUT_MS
                  value: '30000'
              resources:
                requests:
                  cpu: 20m
                  memory: 25Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
